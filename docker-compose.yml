version: '3.9'

services:
  api:
    build:
      context: .
      target: app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: run training as a one-shot service
  trainer:
    build:
      context: .
      target: app
    volumes:
      - ./data:/app/data
    command: python scripts/train_model.py
    profiles:
      - train
