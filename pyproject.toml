[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "courtfind-ai"
version = "1.0.0"
description = "AI-powered sports court discovery and matchmaking engine"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
